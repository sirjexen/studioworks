<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404, halaman tidak ditemukan | Studioworks</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("sw-theme");
        const dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body { display: grid; place-items: center; min-height: 100svh; padding: 24px 14px; }
    .error-card {
      width: min(680px, 100%); padding: clamp(32px, 7vw, 68px); text-align: center;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
    }
    .error-code {
      margin: 24px 0 0; font-size: clamp(5.5rem, 20vw, 11rem); font-weight: 720;
      line-height: .82; letter-spacing: -.09em;
      background: linear-gradient(130deg, var(--ink), var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .error-card h1 { margin: 28px 0 12px; font-size: clamp(1.7rem, 5vw, 2.6rem);
      line-height: 1.08; letter-spacing: -.05em; }
    .error-card > p { max-width: 440px; margin: 0 auto 30px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="error-card">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">SW</span>
      <span>Studioworks</span>
    </a>
    <p class="error-code" aria-hidden="true">404</p>
    <h1>Halaman tidak ditemukan.</h1>
    <p>Alamat mungkin salah ditulis, sudah berubah, atau halaman tersebut belum tersedia.</p>
    <a class="button button-primary" href="/">Kembali ke beranda</a>
  </main>
</body>
</html>
