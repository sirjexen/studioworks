<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="robots" content="noindex">
  <title>404, halaman tidak ditemukan | Studioworks</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 14px;
      color: #141416;
      background:
        radial-gradient(circle at 85% 15%, rgba(181, 190, 209, .42), transparent 30%),
        #f7f7f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: min(720px, 100%);
      padding: clamp(32px, 7vw, 72px);
      text-align: center;
      background: rgba(255, 255, 255, .8);
      border: 1px solid rgba(20, 20, 22, .1);
      border-radius: 30px;
      box-shadow: 0 28px 80px rgba(20, 20, 22, .09);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 48px;
      font-weight: 750;
      letter-spacing: -.025em;
    }

    .mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      color: #fff;
      background: #141416;
      border-radius: 11px;
      font-size: .72rem;
    }

    .code {
      margin: 0;
      font-size: clamp(6rem, 22vw, 12rem);
      font-weight: 720;
      line-height: .8;
      letter-spacing: -.09em;
    }

    h1 {
      margin: 32px 0 12px;
      font-size: clamp(1.8rem, 5vw, 3rem);
      line-height: 1.08;
      letter-spacing: -.05em;
    }

    p { max-width: 460px; margin: 0 auto 30px; color: #62626a; }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 12px 24px;
      color: #fff;
      background: #141416;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
    }

    a.button:hover { background: #303137; }
    a.button:focus-visible { outline: 3px solid #77839c; outline-offset: 4px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="mark" aria-hidden="true">SW</span>
      <span>Studioworks</span>
    </div>
    <p class="code" aria-hidden="true">404</p>
    <h1>Halaman tidak ditemukan.</h1>
    <p>Alamat mungkin salah ditulis, sudah berubah, atau halaman tersebut belum tersedia.</p>
    <a class="button" href="/">Kembali ke beranda</a>
  </main>
</body>
</html>
