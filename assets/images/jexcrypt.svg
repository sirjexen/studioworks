<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="JexCrypt Encryption Laboratory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080a"/>
      <stop offset="1" stop-color="#0a1410"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0" stop-color="#00FF41" stop-opacity=".16"/>
      <stop offset="1" stop-color="#00FF41" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#00FF41" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- Jendela terminal -->
  <g>
    <rect x="150" y="54" width="900" height="196" rx="14" fill="#0b1210" stroke="#00FF41" stroke-opacity=".28"/>
    <rect x="150" y="54" width="900" height="38" rx="14" fill="#0f1a16"/>
    <rect x="150" y="78" width="900" height="14" fill="#0f1a16"/>
    <circle cx="176" cy="73" r="6" fill="#ff5f57"/>
    <circle cx="196" cy="73" r="6" fill="#febc2e"/>
    <circle cx="216" cy="73" r="6" fill="#28c840"/>
    <text x="244" y="78" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#5d7a6c">jexcrypt — secure shell</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
      <text x="178" y="126" fill="#00FF41">[OK]<tspan fill="#9fb3a8" dx="10">Encryption modules loaded</tspan></text>
      <text x="178" y="154" fill="#00FF41">[OK]<tspan fill="#9fb3a8" dx="10">Hash algorithms ready</tspan></text>
      <text x="178" y="182" fill="#00FF41">[OK]<tspan fill="#9fb3a8" dx="10">Security protocols active</tspan></text>
      <text x="178" y="210" fill="#00FF41">[READY]<tspan fill="#e6f5ec" dx="10">System operational</tspan></text>
    </g>
  </g>

  <!-- Judul -->
  <text x="600" y="352" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="78" font-weight="700" letter-spacing="6" fill="#00FF41" fill-opacity=".45" filter="url(#soft)">JEXCRYPT</text>
  <text x="600" y="352" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="78" font-weight="700" letter-spacing="6" fill="#00FF41">JEXCRYPT</text>

  <text x="600" y="392" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" letter-spacing="5" fill="#8aa99a">INTERACTIVE ENCRYPTION LABORATORY</text>

  <!-- Statistik -->
  <g text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">
    <line x1="380" y1="424" x2="820" y2="424" stroke="#00FF41" stroke-opacity=".2"/>
    <text x="410" y="472" font-size="34" font-weight="700" fill="#e6f5ec">256</text>
    <text x="410" y="494" font-size="11" letter-spacing="2" fill="#6f8c7e">BIT ENCRYPTION</text>
    <text x="600" y="472" font-size="34" font-weight="700" fill="#e6f5ec">5+</text>
    <text x="600" y="494" font-size="11" letter-spacing="2" fill="#6f8c7e">TOOLS AVAILABLE</text>
    <text x="790" y="472" font-size="34" font-weight="700" fill="#e6f5ec">∞</text>
    <text x="790" y="494" font-size="11" letter-spacing="2" fill="#6f8c7e">COMBINATIONS</text>
  </g>
</svg>
